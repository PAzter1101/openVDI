  redis:
    container_name: redis_compose
    image: redis:8.0
    restart: always
    ports:
      - "6379:6379"
    networks:
      - openVDI-network
#    command: ["--loglevel", "debug"]
    environment:
      # - REDIS_PASSWORD=my-password
      # - REDIS_PORT=6379
      - REDIS_DATABASES=16

  openvdi:
    container_name: OpenVDI_compose
    build: server/
    # command: ["python3", "./main.py"]
